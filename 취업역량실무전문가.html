<html lang="ko">

<title>취업역량실무전문가</title>

<style>
/* 화면 전체가 한 장의 지면. 모든 조작은 지면 안쪽 모서리에 둔다 */
:root{
  --paper:#F4F4EA;
  --paper-2:#E8E9D9;
  --paper-deep:#D7D9C2;
  --ink:#20230F;
  --ink-soft:#5C6140;
  --ink-faint:#8B9070;
  --accent:#5E6B23;
  --accent-hi:#7D8B3C;
  --accent-ink:#F8F9F0;
  --line:rgba(32,35,15,.15);
  --edge:rgba(32,35,15,.55);
  --line-soft:rgba(32,35,15,.08);
  --bind:rgba(31,36,32,.09);
  --mark:rgba(47,106,85,.18);
  --shadow:rgba(26,30,26,.26);
  --btn-top:#FFFFFF;
  --btn-bot:#E2DDD2;
  --wm-op:.062;
  --font-mg:"Malgun Gothic","맑은 고딕",MalgunGothic,"Apple SD Gothic Neo","Noto Sans KR",
            "Segoe UI",system-ui,-apple-system,sans-serif;
  --font-display:var(--font-mg);
  --font-body:var(--font-mg);
  --font-ui:var(--font-mg);
  --fs:clamp(0.74rem,0.69rem + 0.25vw,0.81rem);
  --lh:1.7;
  --col:47rem;
  --b5:1.4142;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#181A10;--paper-2:#1F2216;--paper-deep:#10120A;
    --ink:#E5E8D4;--ink-soft:#9DA383;--ink-faint:#767C5E;--accent:#B8CC63;--accent-hi:#D2E28C;--accent-ink:#13160A;
    --line:rgba(229,232,212,.16);--line-soft:rgba(229,232,212,.08);--bind:rgba(0,0,0,.4);--edge:rgba(229,232,212,.5);
    --mark:rgba(121,194,166,.22);--shadow:rgba(0,0,0,.6);--btn-top:#2C3330;--btn-bot:#191E1C;--wm-op:.052;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#181A10;--paper-2:#1F2216;--paper-deep:#10120A;
  --ink:#E5E8D4;--ink-soft:#9DA383;--ink-faint:#767C5E;--accent:#B8CC63;--accent-hi:#D2E28C;--accent-ink:#13160A;
  --line:rgba(229,232,212,.16);--line-soft:rgba(229,232,212,.08);--bind:rgba(0,0,0,.4);--edge:rgba(229,232,212,.5);
  --mark:rgba(121,194,166,.22);--shadow:rgba(0,0,0,.6);--btn-top:#2C3330;--btn-bot:#191E1C;--wm-op:.052;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);overflow:hidden;display:flex}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

.btn3d{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;
  border:1px solid var(--line);border-radius:10px;color:var(--ink-soft);
  background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.09),
             0 2px 3px -1px var(--shadow),0 7px 14px -9px var(--shadow);
  transition:transform .09s ease,box-shadow .09s ease,color .15s ease;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn3d{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -2px 0 rgba(0,0,0,.42),0 2px 4px -1px var(--shadow),0 8px 16px -10px var(--shadow)}}
:root[data-theme="dark"] .btn3d{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -2px 0 rgba(0,0,0,.42),0 2px 4px -1px var(--shadow),0 8px 16px -10px var(--shadow)}
.btn3d:hover{color:var(--ink)}
.btn3d:active,.btn3d.on{transform:translateY(2px);box-shadow:inset 0 2px 5px rgba(0,0,0,.22),inset 0 -1px 0 rgba(255,255,255,.18),0 1px 2px -1px var(--shadow)}
.btn3d[disabled]{opacity:.28;cursor:not-allowed;transform:none}
.btn3d svg{display:block}
.btn3d.accent{color:var(--accent-ink);border-color:rgba(0,0,0,.2);background:linear-gradient(180deg,var(--accent-hi),var(--accent))}

/* ── 지면 ── */
.stage{
  position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(130% 100% at 50% 0%,var(--paper-2),var(--paper-deep));
}
/* A4 세로(210:297) 판형으로 고정한 책 */
.book{
  position:relative;
  height:min(calc(100% - 10px),calc((100vw - 10px) * 1.4142));
  aspect-ratio:1 / 1.4142;max-width:calc(100% - 10px);
  perspective:2600px;perspective-origin:0% 50%;
  filter:drop-shadow(0 16px 30px rgba(0,0,0,.24));
}
/* 책등 */
.book::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:11px;z-index:5;pointer-events:none;
  border-radius:12px 0 0 12px;
  background:linear-gradient(to right,var(--accent) 0 60%,rgba(0,0,0,.26) 60% 100%);
}
.leaf{
  position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);
  border:2.5px solid var(--edge);border-radius:12px 28px 28px 12px;
  box-shadow:inset -12px 0 18px -14px rgba(0,0,0,.3),inset 16px 0 16px -14px rgba(0,0,0,.2);
  transform-origin:left center;will-change:transform;
  padding-left:max(clamp(24px,4.4vw,46px),calc(env(safe-area-inset-left,0px) + 14px));
  padding-right:max(clamp(20px,3.8vw,40px),env(safe-area-inset-right,0px));
}
.leaf::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;pointer-events:none;background:linear-gradient(to right,var(--bind),transparent)}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .leaf::after{filter:invert(1)}}
:root[data-theme="dark"] .leaf::after{filter:invert(1)}

.col{width:100%;max-width:100%;margin:0 auto;position:relative;z-index:1}
.head{flex:0 0 auto;padding-top:calc(.85rem + env(safe-area-inset-top,0px));padding-bottom:.45rem;border-bottom:1px solid var(--line-soft);margin-bottom:.1rem}
.head .col{display:flex;align-items:center;min-height:28px;padding-right:112px}
.head .rh{font-family:var(--font-display);font-size:.84rem;font-weight:700;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusline{flex:0 0 auto;padding-top:.35rem;padding-bottom:calc(.7rem + env(safe-area-inset-bottom,0px))}
.statusline .col{display:flex;align-items:center;gap:.5rem;padding-right:80px}
.statusline .track{flex:1;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.statusline .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-hi));transition:width .3s ease}
.statusline .num{font-size:.62rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;letter-spacing:.04em;white-space:nowrap}

.bodywrap{flex:1 1 auto;min-height:0;display:flex;position:relative;z-index:1}
.body{width:100%;max-width:100%;margin:0 auto;overflow:hidden;padding-top:.45rem}
.body.scrollable{overflow-y:auto;padding-right:.5rem}
.body::-webkit-scrollbar{width:6px}
.body::-webkit-scrollbar-track{background:var(--line-soft);border-radius:6px}
.body::-webkit-scrollbar-thumb{background:var(--ink-faint);border-radius:6px;opacity:.6}
.body{scrollbar-width:thin;scrollbar-color:var(--ink-faint) transparent}

.legal{flex:0 0 auto;padding-top:.45rem}
.legal .col{border-top:1px solid var(--line-soft);padding-top:.38rem;padding-right:80px}
.leaf > .legal:last-child{padding-bottom:calc(1.1rem + env(safe-area-inset-bottom,0px))}
@media (max-width:560px){.legal .col{padding-right:72px}.head .col{padding-right:104px}.statusline .col{padding-right:72px}}
.legal p{margin:0;font-size:.56rem;line-height:1.5;color:var(--ink-faint);letter-spacing:-.01em;word-break:keep-all}
.folio{flex:0 0 auto;padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px));padding-top:.3rem}
.folio .col{display:flex;align-items:center;padding-right:88px;font-size:.62rem;color:var(--ink-faint);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.folio .dot{flex:1;height:1px;background:var(--line-soft);margin:0 .6rem}

/* 지면 안쪽 모서리 조작부 */
.corner{position:absolute;z-index:9;display:flex;align-items:center;gap:.32rem}
.book > .corner{z-index:12}
.corner.tr{top:calc(11px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.corner.br{bottom:calc(11px + env(safe-area-inset-bottom,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.spk{width:28px;height:26px;border-radius:7px}
.spk svg{width:14px;height:14px}
.navsq{width:30px;height:27px;border-radius:7px}
.navsq svg{width:13px;height:13px}
.minibtn{height:26px;padding:0 .48rem;border-radius:7px;font-size:.66rem;gap:.26rem}
.minibtn.sq{width:26px;padding:0}
.minibtn svg{width:13px;height:13px}
.minibtn svg{width:14px;height:14px}

/* ── 말리는 종이 ── */
.curl{position:absolute;inset:0;z-index:6;pointer-events:none;transform-origin:left center;transform-style:preserve-3d}
.strip{position:absolute;left:0;top:0;overflow:hidden;background:var(--paper);transform-origin:left center;transform-style:preserve-3d;will-change:transform}
.strip-inner{position:relative;overflow:hidden;backface-visibility:hidden}
.strip-inner .leaf{border-radius:0;box-shadow:none}
.strip-shade{position:absolute;inset:0;background:#05100C;opacity:0;pointer-events:none}
.castshadow{position:absolute;top:0;bottom:0;left:0;width:48%;z-index:2;pointer-events:none;opacity:0;background:linear-gradient(to right,rgba(0,0,0,.34),rgba(0,0,0,0))}
@keyframes fadeIn{from{opacity:0}}
.leaf.fade{animation:fadeIn .18s linear both}

/* ── 겉표지 ── */
.coverbody{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;justify-content:center;position:relative;z-index:1}
.front{
  width:100%;max-width:none;height:100%;position:relative;display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(1.4rem,4.5vw,2.6rem) clamp(.2rem,1vw,.8rem);
}
.front .rulebox{position:absolute;inset:clamp(.5rem,1.8vw,1.1rem) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);pointer-events:none}
.cv-top{position:relative;display:flex;align-items:center;gap:.5rem}
.cv-top .wm{width:20px;height:1px;background:var(--accent)}
.cv-kicker{font-size:.6rem;letter-spacing:.28em;color:var(--accent)}
.cv-mid{position:relative;display:flex;flex-direction:column;gap:.8rem}
.cv-mid h1{font-family:var(--font-display);font-weight:700;margin:0;color:var(--ink);font-size:clamp(1.5rem,.95rem + 3.6vw,2.4rem);line-height:1.3;letter-spacing:-.04em;text-wrap:balance;word-break:keep-all}
.cv-mid .sub{font-family:var(--font-body);font-size:clamp(.82rem,.72rem + .5vw,.98rem);color:var(--accent);line-height:1.6;margin:0;letter-spacing:.06em;font-weight:600;word-break:keep-all}
.cv-mid .hair{width:46px;height:1px;background:var(--ink);opacity:.4}
.cv-foot{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:.8rem}
.cv-foot .author{font-family:var(--font-display);font-size:clamp(.88rem,.8rem + .4vw,1.02rem)}
.cv-foot .author small{display:block;font-family:var(--font-ui);font-size:.56rem;letter-spacing:.2em;color:var(--ink-soft);margin-bottom:.22rem}
.cv-foot .imprint{font-size:.6rem;color:var(--ink-soft);letter-spacing:.08em;text-align:right}
.openbtn{height:36px;padding:0 1.05rem;font-size:.76rem;font-weight:600;align-self:flex-start;margin-top:.8rem;border-radius:999px}

/* ── 차례 ── */
.toc h2{font-family:var(--font-display);font-size:clamp(1.15rem,1rem + .8vw,1.45rem);margin:0 0 1rem;font-weight:700;letter-spacing:-.02em}
.toclist{list-style:none;margin:0;padding:0}
.toclist button{width:100%;display:flex;align-items:baseline;gap:.6rem;text-align:left;padding:.52rem 0;border-bottom:1px solid var(--line-soft);transition:padding-left .15s}
.toclist button:hover{padding-left:.25rem}
.toclist button:hover .tt{color:var(--accent)}
.toclist .tn{flex:0 0 3.6rem;font-size:.6rem;letter-spacing:.1em;color:var(--accent)}
.toclist .tt{flex:1;min-width:0;font-family:var(--font-body);font-size:.8rem;word-break:keep-all;line-height:1.5;transition:color .15s}
.toclist .tp{font-size:.62rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.toclist .homeitem .tn{color:var(--ink-soft)}
.toclist .homeitem .tt{font-weight:600}
.toclist .homeitem .tp{color:var(--accent);letter-spacing:.1em}

/* ── 조판 ── */
.bp,.bq,.bl li,.bqz,.opts li{font-family:var(--font-body);font-size:var(--fs);line-height:var(--lh);letter-spacing:-.012em;word-break:keep-all}
.bp{margin:0 0 .72em}
.bl{margin:0 0 .85em;padding-left:1.05em}
.bl li{margin-bottom:.4em}
.bl li::marker{color:var(--accent)}
.bq{margin:0 0 1.1em;padding:.1em 0 .1em .9em;border-left:2px solid var(--accent);color:var(--ink-soft)}
.bh{font-family:var(--font-display);font-weight:700;font-size:calc(var(--fs) * 1.1);margin:1em 0 .4em;text-wrap:balance;color:var(--ink)}
.bh:first-child{margin-top:0}
.bnote{margin:0 0 .85em;padding:.58rem .75rem;border-radius:7px;background:var(--paper-2);border-left:3px solid var(--accent);font-family:var(--font-body);font-size:calc(var(--fs) * .9);line-height:1.74;color:var(--ink-soft)}
.bqz{margin:.95em 0 .35em;font-weight:600;color:var(--ink)}
.opts{list-style:none;margin:0 0 1em;padding:0}
.opts li{margin-bottom:.14em;color:var(--ink-soft)}
.tw{margin:0 0 .8em}
.tw table{border-collapse:collapse;width:100%;table-layout:fixed;font-family:var(--font-ui);font-size:calc(var(--fs) * .8);line-height:1.5}
.tw th,.tw td{border:1px solid var(--line);padding:.34em .42em;text-align:left;vertical-align:top;word-break:break-word;overflow-wrap:anywhere;hyphens:auto}
.tw th{background:var(--paper-2);font-weight:600;color:var(--ink)}
.tw td{color:var(--ink-soft)}
.chap{margin:0 0 .85rem}
.chap .num{display:block;font-family:var(--font-ui);font-size:.6rem;letter-spacing:.22em;color:var(--accent);margin-bottom:.45rem}
.chap h2{font-family:var(--font-display);font-weight:700;font-size:clamp(1.12rem,.95rem + .9vw,1.4rem);line-height:1.38;margin:0 0 .6rem;letter-spacing:-.02em;text-wrap:balance}
.chap .rule{height:1px;background:var(--line)}
.s.speaking{background:var(--mark);border-radius:3px;box-shadow:0 0 0 2px var(--mark)}


/* ── 설정 시트 ── */
.sheetwrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheetwrap::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{
  position:relative;width:100%;max-width:34rem;background:var(--paper);
  border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0;
  max-height:min(82vh,660px);overflow-y:auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:1.1rem calc(1.2rem + env(safe-area-inset-bottom,0px));
  animation:rise .22s cubic-bezier(.3,.1,.2,1) both;
}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.leaf.fade{animation:none}}
.panel h3{font-family:var(--font-display);font-size:1rem;margin:0 0 .85rem;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.58rem;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row label{font-size:.82rem}
.row .hint{display:block;font-size:.68rem;color:var(--ink-soft);margin-top:.14rem;max-width:21ch;word-break:keep-all}
.seg{display:inline-flex;border-radius:10px;overflow:hidden;flex:0 0 auto;border:1px solid var(--line);background:linear-gradient(180deg,var(--btn-top),var(--btn-bot))}
.seg button{padding:.34rem .6rem;font-size:.75rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:var(--accent-ink);box-shadow:inset 0 1px 3px rgba(0,0,0,.22)}
select{font:inherit;font-size:.78rem;color:var(--ink);background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));border:1px solid var(--line);border-radius:10px;padding:.32rem .42rem;max-width:11rem}
input[type=range]{width:8rem;accent-color:var(--accent)}
.closebtn{position:absolute;top:.55rem;right:.7rem;font-size:.74rem;color:var(--ink-soft);padding:.35rem .5rem;border-radius:8px}
.closebtn:hover{background:var(--paper-2)}
.sbtn{height:32px;padding:0 .7rem;font-size:.74rem;border-radius:10px}
/* ── 설정 펼침메뉴 ── */
.corner.tr .dropdown{
  position:absolute;top:calc(100% + .42rem);right:0;z-index:16;
  width:min(19.5rem,78vw);background:var(--paper);
  border:1px solid var(--line);border-radius:13px;
  box-shadow:0 12px 32px var(--shadow),0 2px 6px rgba(0,0,0,.12);
  padding:.25rem .85rem .55rem;text-align:left;
  animation:drop .16s cubic-bezier(.3,.1,.2,1) both;
}
@keyframes drop{from{transform:translateY(-7px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.corner.tr .dropdown{animation:none}}
.corner.tr .dropdown .row{padding-block:.52rem;gap:.7rem}
.corner.tr .dropdown .row label{font-size:.78rem}
.corner.tr .dropdown .row .hint{max-width:13rem}
.corner.tr .dropdown .seg button{padding:.3rem .52rem;font-size:.72rem}
#measure{position:absolute;visibility:hidden;pointer-events:none;left:-9999px;top:0}
.leaf,.leaf *{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>
</head>
<body>
<div class="stage">
  <div class="book" id="book">
  <div class="corner tr">
      <button class="btn3d minibtn" id="tocBtn" aria-label="차례">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>차례</span>
      </button>
      <button class="btn3d minibtn sq" id="setBtn" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.1"/><circle cx="9" cy="17" r="2.1"/></svg>
      </button>
      <button class="btn3d spk" id="readBtn" aria-label="읽어주기">
        <svg id="readIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h3.6L13 19V5L7.6 9H4z"/><path d="M16.4 8.9a4 4 0 010 6.2"/><path d="M19 6.6a7.4 7.4 0 010 10.8"/></svg>
      </button>
    </div>

    <div class="corner br">
      <button class="btn3d navsq" id="prevBtn" aria-label="앞쪽으로 넘기기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="btn3d navsq" id="nextBtn" aria-label="다음 쪽으로 넘기기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

</div>

<div id="measure"></div>

function dec(s, k){
  const b = atob(s), n = b.length, out = new Uint8Array(n);
  for(let i = 0; i < n; i++) out[i] = b.charCodeAt(i) ^ k.charCodeAt(i % k.length);
  return new TextDecoder('utf-8').decode(out);
}

/* ── 넘김 소리 ── */
let actx = null;
function audio(){
  if(actx){ if(actx.state === 'suspended') actx.resume(); return actx; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  try{ actx = new AC(); }catch(e){ return null; }
  return actx;
}
function pageSound(soft){
  if(!prefs.sound) return;
  const ctx = audio();
  if(!ctx) return;
  const t0 = ctx.currentTime, dur = 0.44, len = Math.ceil(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for(let i = 0; i < len; i++){ const w = Math.random() * 2 - 1; last = 0.72 * last + 0.28 * w; d[i] = last; }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
  bp.frequency.setValueAtTime(740, t0);
  bp.frequency.exponentialRampToValueAtTime(4500, t0 + 0.16);
  bp.frequency.exponentialRampToValueAtTime(1500, t0 + dur);
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 520;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  const peak = soft ? 0.07 : 0.13;
  g.gain.linearRampToValueAtTime(peak, t0 + 0.035);
  g.gain.exponentialRampToValueAtTime(0.025, t0 + 0.18);
  g.gain.linearRampToValueAtTime(peak * 0.65, t0 + 0.22);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(ctx.destination);
  src.start(t0); src.stop(t0 + dur);
}

function splitSentences(text){
  const out = text.match(/[^.!?。？！…]+(?:[.!?。？！…]+["')\]」』]*\s*)?/g);
  return (out && out.length) ? out : [text];
}
function sentSpans(parent, text){
  splitSentences(text).forEach(s => {
    const sp = document.createElement('span');
    sp.className = 's'; sp.textContent = s;
    parent.appendChild(sp);
  });
}
function makeEl(b){
  if(b.t === 'chap'){
    const d = document.createElement('header'); d.className = 'chap';
    const n = document.createElement('span'); n.className = 'num'; n.textContent = b.n;
    const h = document.createElement('h2'); h.textContent = b.v;
    const r = document.createElement('div'); r.className = 'rule';
    d.append(n, h, r); return d;
  }
  if(b.t === 'h'){ const h = document.createElement('h3'); h.className = 'bh'; h.textContent = b.v; return h; }
  if(b.t === 'qz'){ const p = document.createElement('p'); p.className = 'bqz'; sentSpans(p, b.v); return p; }
  if(b.t === 'opts' || b.t === 'list'){
    const ul = document.createElement('ul'); ul.className = (b.t === 'opts' ? 'opts' : 'bl');
    b.v.forEach(x => { const li = document.createElement('li'); sentSpans(li, x); ul.appendChild(li); });
    return ul;
  }
  if(b.t === 'table'){
    const w = document.createElement('div'); w.className = 'tw';
    const t = document.createElement('table');
    b.v.forEach((row, ri) => {
      const tr = document.createElement('tr');
      row.forEach(cell => {
        const td = document.createElement(ri === 0 ? 'th' : 'td');
        td.textContent = cell;
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    w.appendChild(t); return w;
  }
  if(b.t === 'quote'){ const q = document.createElement('blockquote'); q.className = 'bq'; sentSpans(q, b.v); return q; }
  if(b.t === 'note'){ const d = document.createElement('div'); d.className = 'bnote'; sentSpans(d, b.v); return d; }
  const p = document.createElement('p'); p.className = 'bp'; sentSpans(p, b.v); return p;
}

/* ── 쪽 나누기 ── */
function measureBox(){
  const probe = buildLeaf({type:'text', blocks:[], chapter:0}, 1);
  probe.style.visibility = 'hidden';
  book.appendChild(probe);
  const bodyEl = probe.querySelector('.body');
  const box = { w: bodyEl.clientWidth, h: bodyEl.clientHeight };
  probe.remove();
  return box;
}
function paginate(){
  const box = measureBox();
  if(box.h <= 40 || box.w <= 0){ pages = [{type:'cover'},{type:'toc'}]; return; }
  measure.style.width = box.w + 'px';
  measure.innerHTML = '';
  const limit = box.h;
  const out = [{type:'cover'}, {type:'toc'}];
  let buf = [], chapIdx = 0;
  const fits = () => measure.scrollHeight <= limit;
  function flush(){ if(buf.length){ out.push({type:'text', blocks:buf, chapter:chapIdx}); buf = []; measure.innerHTML = ''; } }
  function addBlock(b, depth){
    const el = makeEl(b);
    measure.appendChild(el);
    if(fits()){ buf.push(b); return; }
    measure.removeChild(el);
    if(b.t === 'p' || b.t === 'note'){
      const sents = splitSentences(b.v);
      if(sents.length > 1){
        const probe = makeEl({t:b.t, v:''});
        measure.appendChild(probe);
        let fit = 0;
        for(let i = 0; i < sents.length - 1; i++){
          probe.textContent = sents.slice(0, i + 1).join('');
          if(fits()) fit = i + 1; else break;
        }
        measure.removeChild(probe);
        if(fit > 0){
          buf.push({t:b.t, v:sents.slice(0, fit).join('')});
          flush();
          addBlock({t:b.t, v:sents.slice(fit).join('')}, 0);
          return;
        }
      }
    }
    if(buf.length === 0 || depth > 0){ buf.push(b); flush(); return; }
    flush();
    addBlock(b, depth + 1);
  }
  BOOK.chapters.forEach((ch, ci) => {
    flush();
    chapIdx = ci;
    addBlock({t:'chap', v:ch.title, n:ch.label || ('제 ' + (ci + 1) + ' 장')}, 0);
    ch.blocks.forEach(b => addBlock(b, 0));
  });
  flush();
  measure.innerHTML = '';
  pages = out;
}
function chapterStart(ci){
  for(let i = 0; i < pages.length; i++) if(pages[i].type === 'text' && pages[i].chapter === ci) return i;
  return 2;
}

/* ── 지면 만들기 ── */
function tocList(onPick){
  const ul = document.createElement('ul');
  ul.className = 'toclist';
  BOOK.chapters.forEach((ch, ci) => {
    const li = document.createElement('li');

    b.innerHTML = '<span class="tn"></span><span class="tt"></span><span class="tp"></span>';
    const start = chapterStart(ci);
    b.querySelector('.tn').textContent = ch.label || ('제' + (ci + 1) + '장');
    b.querySelector('.tt').textContent = ch.title;

    b.addEventListener('click', e => { e.stopPropagation(); onPick(start); });

}
function legalEl(){

  d.className = 'legal';

function buildLeaf(p, index){

    c.querySelector('.cv-kicker').textContent = BOOK.kicker || '전자책';

    c.querySelector('.an').textContent = BOOK.author || '';

    wrap.appendChild(c);

  }

  const head = document.createElement('div');

    : (BOOK.chapters[p.chapter] ? (BOOK.chapters[p.chapter].label + ' · ' + BOOK.chapters[p.chapter].title) : BOOK.title);

  const total = pages.length - 2;

  status.querySelector('i').style.width = (total > 0 ? (done / total * 100) : 0) + '%';
  status.querySelector('.num').textContent = p.type === 'toc' ? ('모두 ' + total + '쪽') : (done + ' / ' + total + '쪽');

  const wrap = document.createElement('div');
  wrap.className = 'bodywrap';
  const bodyEl = document.createElement('div');

  wrap.appendChild(bodyEl);

  if(p.type === 'toc'){

function chrome(i){
  const p = pages[i];
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === pages.length - 1;
  readBtn.disabled = !ttsOK || p.type === 'cover';
  savePos(i);
}

/* ── 말림 ── */
function easeInOut(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
function buildCurl(sourceLeaf, w, h, n){
  const count = n || STRIPS;
  const sw = w / count;
  const wrap = document.createElement('div');
  wrap.className = 'curl';
  const base = sourceLeaf.cloneNode(true);
  const strips = [];
  for(let i = 0; i < count; i++){
    const st = document.createElement('div');
    st.className = 'strip';
    st.style.width = (sw + 0.8) + 'px';
    st.style.height = h + 'px';
    const inner = document.createElement('div');
    inner.className = 'strip-inner';
    inner.style.width = w + 'px';
    inner.style.height = h + 'px';
    inner.style.transform = 'translateX(' + (-i * sw) + 'px)';
    inner.appendChild(i === 0 ? base : base.cloneNode(true));
    const sh = document.createElement('div');
    sh.className = 'strip-shade';
    st.append(inner, sh);
    wrap.appendChild(st);
    strips.push({ el: st, shade: sh, x: i * sw });
  }
  return { wrap, strips, w };
}
function applyCurl(c, p, cast){
  const t = Math.min(1, Math.max(0, p));
  const curl = Math.sin(Math.PI * t);
  const R = c.w / (0.0016 + 2.1 * curl);
  c.wrap.style.transform = 'rotateY(' + (-t * 150).toFixed(2) + 'deg)';
  for(let i = 0; i < c.strips.length; i++){
    const s = c.strips[i];
    const th = Math.min(s.x / R, 2.6);
    const X = R * Math.sin(th);
    const Z = R * (Math.cos(th) - 1);
    s.el.style.transform =
      'translate3d(' + X.toFixed(2) + 'px,0,' + Z.toFixed(2) + 'px) rotateY(' + (th * 57.29578).toFixed(2) + 'deg)';
    s.shade.style.opacity = Math.min(0.55, (1 - Math.cos(th)) * 0.46 + t * 0.07).toFixed(3);
  }
  if(cast) cast.style.opacity = (Math.sin(Math.PI * t) * 0.55).toFixed(3);
}
function runCurl(c, from, to, ms, cast, onDone){
  const t0 = performance.now();
  let raf = 0, live = true;
  applyCurl(c, from, cast);
  function finish(){
    if(!live) return;
    live = false;
    cancelAnimationFrame(raf);
    if(anim && anim.finish === finish) anim = null;
    onDone();
  }
  function step(now){
    if(!live) return;
    const t = Math.min(1, (now - t0) / ms);
    applyCurl(c, from + (to - from) * easeInOut(t), cast);
    if(t < 1) raf = requestAnimationFrame(step); else finish();
  }
  anim = { finish: finish };
  raf = requestAnimationFrame(step);
}

function show(i, dir, fast){
  if(anim) anim.finish();
  cur = Math.max(0, Math.min(pages.length - 1, i));
  const next = buildLeaf(pages[cur], cur);
  const old = leaf;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const w = book.clientWidth, h = book.clientHeight;

  if(!old || dir === 0 || reduce || w < 80 || h < 80){
    if(old) old.remove();
    book.appendChild(next);
    if(old && dir) next.classList.add('fade');
    leaf = next; turning = false;
    chrome(cur); finishTurn(next);
    return;
  }

  turning = true;
  pageSound(fast);
  const cast = document.createElement('div');
  cast.className = 'castshadow';
  const ms = fast ? 260 : 700;

  if(dir > 0){
    const c = buildCurl(old, w, h, fast ? 8 : STRIPS);
    next.style.zIndex = '1';
    book.appendChild(next); book.appendChild(cast); book.appendChild(c.wrap);
    old.remove();
    leaf = next; chrome(cur);
    runCurl(c, 0, 1, ms, cast, () => {
      c.wrap.remove(); cast.remove(); next.style.zIndex = '';
      finishTurn(next);
    });
  } else {
    const c = buildCurl(next, w, h, fast ? 8 : STRIPS);
    if(old) old.style.zIndex = '1';
    next.style.zIndex = '2';
    book.appendChild(next); book.appendChild(cast); book.appendChild(c.wrap);
    leaf = next; chrome(cur);
    runCurl(c, 1, 0, ms, cast, () => {
      c.wrap.remove(); cast.remove();
      if(old) old.remove();
      next.style.zIndex = '';
      finishTurn(next);
    });
  }
}
function finishTurn(el){
  turning = false;
  const bodyEl = el.querySelector('.body');
  if(bodyEl && bodyEl.scrollHeight > bodyEl.clientHeight + 4) bodyEl.classList.add('scrollable');
  if(pendingSpeak){ pendingSpeak = false; startSpeech(true); }
}
function go(delta, fast){
  const t = cur + delta;
  if(t < 0 || t >= pages.length) return;
  if(speaking && !advancing) stopSpeech();
  show(t, delta, fast);
}
let flipping = null;
function jump(target){
  target = Math.max(0, Math.min(pages.length - 1, target));
  if(target === cur) return;
  if(speaking) stopSpeech();
  if(flipping){ clearTimeout(flipping); flipping = null; }
  const dir = target > cur ? 1 : -1;
  const d = Math.abs(target - cur);
  if(d === 1){ show(target, dir); return; }
  const steps = Math.min(d, 9);
  const from = cur;
  const seq = [];
  for(let i = 1; i <= steps; i++) seq.push(from + dir * Math.round(d * i / steps));
  seq[seq.length - 1] = target;
  let k = 0;
  (function step(){
    if(k >= seq.length){ flipping = null; return; }
    const last = (k === seq.length - 1);
    show(seq[k], dir, !last);
    k++;
    flipping = last ? null : setTimeout(step, 150);
  })();
}

/* ── 읽어주기 ──
   1순위 : 사무실 서버의 「다은」 목소리 — 구글 Text-to-Speech ko-KR-Wavenet-A
   2순위 : 보는 사람 기기에 깔린 음성
   서버에 닿지 못하면 소리가 끊기지 않도록 곧바로 기기 음성으로 내려간다. */
const TTS = {
  url: 'https://btckorea-485701403134.asia-northeast3.run.app/api/tts',
  who: 'daeun',
  voice: 'ko-KR-Wavenet-A',
  rate: 0.98,
  pitch: 0.0,
  chunk: 900
};
const synth = window.speechSynthesis;
const ttsOK = !!synth && typeof SpeechSynthesisUtterance === 'function';
let voices = [], queue = [], qi = 0;
let speaking = false, advancing = false, pendingSpeak = false;
let srvState = 'unknown';            /* unknown · ok · off */
let player = null;
const mp3Cache = new Map();
let noticeTimer = null;
let lastTtsError = null;

function notice(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:40;' +
      'background:var(--ink);color:var(--paper);font-size:.74rem;padding:.5rem .8rem;border-radius:999px;' +
      'box-shadow:0 6px 18px -8px rgba(0,0,0,.6);max-width:80vw;text-align:center;word-break:keep-all';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { el.hidden = true; }, 3400);
}

/* 기기 음성 — 구글 계열을 먼저 고른다 */
function voiceScore(v){
  const n = (v.name || '').toLowerCase();
  let s = 0;
  if(/^ko/i.test(v.lang)) s += 300;
  if(n.indexOf('google') !== -1) s += 150;
  if(n.indexOf('natural') !== -1) s += 70;
  if(n.indexOf('neural') !== -1) s += 70;
  if(n.indexOf('online') !== -1) s += 30;
  if(v.localService === false) s += 40;
  if(/yuna|유나|sunhi|선히|seoyeon|jiyoon|female|여성/.test(n)) s += 25;
  if(/injoon|인준|male|남성|minsang/.test(n)) s -= 20;
  if(/heami|해미/.test(n)) s -= 20;
  return s;
}
function pickVoice(){
  if(!voices.length) return null;
  if(prefs.voice){ const v = voices.find(x => x.voiceURI === prefs.voice); if(v) return v; }
  return voices[0];
}
function refreshVoices(){
  if(!ttsOK) return;
  const all = synth.getVoices() || [];
  const ko = all.filter(v => /^ko/i.test(v.lang));
  voices = (ko.length ? ko : all).slice().sort((a, b) => voiceScore(b) - voiceScore(a));
  const sel = document.getElementById('voiceSel');
  if(sel){
    sel.innerHTML = '';
    voices.forEach((v, i) => {
      const o = document.createElement('option');
      o.value = v.voiceURI;
      let label = v.name.replace(/^Microsoft\s+/i, '').replace(/\s*-\s*Korean.*$/i, '');
      if(!/^ko/i.test(v.lang)) label += ' (' + v.lang + ')';
      o.textContent = (i === 0 ? '자동 · ' : '') + label;
      sel.appendChild(o);
    });
    const p = pickVoice();
    if(p) sel.value = p.voiceURI;
  }
}
if(ttsOK){ refreshVoices(); synth.addEventListener('voiceschanged', refreshVoices); }

function setReadUI(on){
  readIcon.innerHTML = on ? ICON_STOP : ICON_SPK;
  readBtn.classList.toggle('on', on);
  readBtn.setAttribute('aria-label', on ? '읽기 멈춤' : '읽어주기');
}
function clearMark(){ if(leaf) leaf.querySelectorAll('.s.speaking').forEach(e => e.classList.remove('speaking')); }
function scrollIntoPage(el){
  const bodyEl = leaf && leaf.querySelector('.body');
  if(!bodyEl || !bodyEl.classList.contains('scrollable')) return;
  const r = el.getBoundingClientRect(), vr = bodyEl.getBoundingClientRect();
  if(r.bottom > vr.bottom - 8 || r.top < vr.top + 8) bodyEl.scrollTop += (r.top - vr.top) - bodyEl.clientHeight / 3;
}
function stopSpeech(){
  speaking = false; advancing = false; pendingSpeak = false; queue = []; qi = 0;
  if(ttsOK) synth.cancel();
  if(player){ try{ player.pause(); player.currentTime = 0; }catch(e){} }
  clearMark(); setReadUI(false);
}

/* 글을 1,000자 안쪽 토막으로 묶는다. 문장 한가운데에서 자르지 않는다 */
function ttsChunks(spans){
  const out = [];
  let cur = { text:'', spans:[] };
  spans.forEach(sp => {
    const t = (sp.textContent || '').trim();
    if(!t) return;
    if(cur.text && (cur.text.length + t.length + 1) > TTS.chunk){ out.push(cur); cur = { text:'', spans:[] }; }
    cur.text += (cur.text ? ' ' : '') + t;
    cur.spans.push(sp);
  });
  if(cur.text) out.push(cur);
  return out;
}
async function fetchMp3(text){
  if(mp3Cache.has(text)) return mp3Cache.get(text);
  const headers = { 'content-type': 'application/json' };
  if(prefs.gate) headers['x-btck-gate'] = prefs.gate;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 12000);
  try{
    const r = await fetch(TTS.url, {
      method: 'POST', headers, signal: ctl.signal,
      body: JSON.stringify({ text: text, who: TTS.who, voice: TTS.voice,
                             rate: TTS.rate, pitch: TTS.pitch })
    });
    if(!r.ok){ const e = new Error('tts'); e.code = r.status; throw e; }
    const b = await r.blob();
    if(!b || b.size < 200){ const e = new Error('empty'); e.code = 'empty'; throw e; }
    const url = URL.createObjectURL(b);
    mp3Cache.set(text, url);
    return url;
  } catch(err){
    if(err && err.code === undefined) err.code = (err.name === 'AbortError') ? 'slow' : 'net';
    lastTtsError = err.code;
    throw err;
  } finally { clearTimeout(timer); }
}
function ttsWhy(code){
  if(code === 401 || code === 403) return '서버 열쇠말이 맞지 않아 기기 음성으로 읽습니다';
  if(code === 503) return '서버가 목소리를 만들지 못했습니다';
  if(code === 'slow') return '서버 응답이 느려 기기 음성으로 읽습니다';
  if(code === 'net') return '이 화면에서는 바깥 서버를 부를 수 없어 기기 음성으로 읽습니다';
  if(typeof code === 'number') return '서버 오류(' + code + ') — 기기 음성으로 읽습니다';
  return '서버에 닿지 못해 기기 음성으로 읽습니다';
}
function playUrl(url){
  return new Promise(res => {
    if(!player) player = new Audio();
    player.onended = () => res('end');
    player.onerror = () => res('err');
    player.src = url;
    const p = player.play();
    if(p && p.catch) p.catch(() => res('err'));
  });
}
function markChunk(ch){
  clearMark();
  ch.spans.forEach(sp => sp.classList.add('speaking'));
  if(ch.spans[0]) scrollIntoPage(ch.spans[0]);
}
async function readWithServer(spans){
  const chunks = ttsChunks(spans);
  if(!chunks.length) return 'done';
  let ahead;
  try{ ahead = await fetchMp3(chunks[0].text); }
  catch(e){ return 'fail'; }
  srvState = 'ok';
  for(let i = 0; i < chunks.length; i++){
    if(!speaking) return 'stopped';
    const url = ahead;
    if(i + 1 < chunks.length) ahead = fetchMp3(chunks[i + 1].text).catch(() => null);
    markChunk(chunks[i]);
    await playUrl(url);
    if(!speaking) return 'stopped';
    if(i + 1 < chunks.length){
      ahead = await ahead;
      if(!ahead) return 'fail';
    }
  }
  return 'done';
}
function readWithDevice(spans){
  queue = spans; qi = 0;
  if(!queue.length){ afterPage(); return; }
  speakNext();
}
function speakNext(){
  if(!speaking) return;
  if(qi >= queue.length){ clearMark(); afterPage(); return; }
  const span = queue[qi];
  const text = (span.textContent || '').trim();
  if(!text){ qi++; speakNext(); return; }
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'ko-KR';
  u.rate = prefs.rate; u.pitch = prefs.pitch;
  u.onstart = () => { clearMark(); span.classList.add('speaking'); scrollIntoPage(span); };
  u.onend = () => { if(speaking){ qi++; speakNext(); } };
  u.onerror = () => { if(speaking){ qi++; speakNext(); } };
  synth.speak(u);
}
function afterPage(){
  if(prefs.auto && cur < pages.length - 1){
    advancing = true; pendingSpeak = true;
    show(cur + 1, 1);
    advancing = false;
  } else stopSpeech();
}
async function startSpeech(){
  if(!leaf) return;
  const spans = Array.from(leaf.querySelectorAll('.body .s'));
  if(!spans.length){ afterPage(); return; }
  speaking = true;
  setReadUI(true);
  if(prefs.srv && srvState !== 'off'){
    const r = await readWithServer(spans);
    if(r === 'stopped') return;
    if(r === 'done'){ afterPage(); return; }
    srvState = 'off';
    notice(ttsWhy(lastTtsError));
  }
  if(!ttsOK){ stopSpeech(); notice('이 기기는 읽어주기를 지원하지 않습니다'); return; }
  if(!speaking) return;
  synth.cancel();
  readWithDevice(spans);
}
readBtn.addEventListener('click', e => { e.stopPropagation(); audio(); speaking ? stopSpeech() : startSpeech(false); });

/* ── 넘기기 ── */
function holdNav(btn, delta){
  let hold = null, rep = null, viaPointer = false;
  const stop = () => { clearTimeout(hold); clearInterval(rep); hold = null; rep = null; };
  btn.addEventListener('pointerdown', e => {
    if(e.button && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    viaPointer = true; audio(); go(delta); stop();
    hold = setTimeout(() => { rep = setInterval(() => go(delta, true), 360); }, 520);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  window.addEventListener('blur', stop);
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if(viaPointer){ viaPointer = false; return; }
    audio(); go(delta);
  });
}
holdNav(prevBtn, -1);
holdNav(nextBtn, 1);
/* 지면 안쪽을 반으로 갈라 — 왼쪽은 앞 장, 오른쪽은 다음 장 */
book.addEventListener('click', e => {
  if(e.target.closest && e.target.closest('.dropdown')) return;
  if(document.querySelector('.dropdown')){ closeMenu(); return; }
  if(e.target.closest && e.target.closest('button,a,select,input,label,.panel,.toclist')) return;
  const r = book.getBoundingClientRect();
  if(r.width < 40) return;
  audio();
  go((e.clientX - r.left) < r.width / 2 ? -1 : 1);
});

document.addEventListener('keydown', e => {
  if(document.querySelector('.dropdown')){ if(e.key === 'Escape') closeMenu(); return; }
  if(document.querySelector('.sheetwrap')){ if(e.key === 'Escape') closePanel(); return; }
  if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); audio(); go(1); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); audio(); go(-1); }
  else if(e.key === 'Home'){ jump(0); }
  else if(e.key === 'End'){ jump(pages.length - 1); }
});
let tx = 0, ty = 0;
const stage = document.querySelector('.stage');
stage.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, {passive:true});
stage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.5){ audio(); go(dx < 0 ? 1 : -1); }
}, {passive:true});

/* ── 시트 ── */
function closePanel(){ const w = document.querySelector('.sheetwrap'); if(w) w.remove(); }
function closeMenu(){ const m = document.querySelector('.dropdown'); if(m) m.remove(); }
function openPanel(title, build){
  closePanel();
  const wrap = document.createElement('div'); wrap.className = 'sheetwrap';
  const panel = document.createElement('div'); panel.className = 'panel';
  const close = document.createElement('button'); close.className = 'closebtn'; close.textContent = '닫기';
  close.addEventListener('click', closePanel);
  const h = document.createElement('h3'); h.textContent = title;
  panel.append(close, h);
  build(panel);
  wrap.appendChild(panel);
  wrap.addEventListener('click', e => { if(e.target === wrap) closePanel(); });
  document.body.appendChild(wrap);
}
function segment(options, isOn, onPick){
  const seg = document.createElement('div');
  seg.className = 'seg';
  options.forEach(([label, val]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.setAttribute('aria-pressed', String(isOn(val)));
    b.addEventListener('click', () => {
      onPick(val);
      seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    });
    seg.appendChild(b);
  });
  return seg;
}
function makeRow(panel, labelHTML){
  const r = document.createElement('div');
  r.className = 'row';
  r.innerHTML = '<label>' + labelHTML + '</label>';
  panel.appendChild(r);
  return r;
}
document.getElementById('tocBtn').addEventListener('click', e => {
  e.stopPropagation();
  openPanel('차례', panel => {
    const ul = tocList(i => { closePanel(); jump(i); });
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'homeitem';
    b.innerHTML = '<span class="tn">표지</span><span class="tt">처음으로 돌아가기</span><span class="tp">홈</span>';
    b.addEventListener('click', () => { closePanel(); jump(0); });
    li.appendChild(b);
    ul.insertBefore(li, ul.firstChild);
    panel.appendChild(ul);
  });
});
document.getElementById('setBtn').addEventListener('click', e => {
  e.stopPropagation();
  if(document.querySelector('.dropdown')){ closeMenu(); return; }
  closePanel();
  const m = document.createElement('div');
  m.className = 'dropdown';
  m.addEventListener('click', ev => ev.stopPropagation());

  const r1 = makeRow(m, '글자 크기<span class="hint">크기를 바꾸면 쪽수가 다시 계산됩니다</span>');
  r1.appendChild(segment([['작게',0],['보통',1],['크게',2]], v => prefs.size === v, v => { prefs.size = v; save(); applyPrefs(); relayout(); }));

  const r2 = makeRow(m, '지면 색');
  r2.appendChild(segment([['기기',"system"],['밝게','light'],['어둡게','dark']], v => prefs.theme === v, v => { prefs.theme = v; save(); applyPrefs(); }));

  const r3 = makeRow(m, '넘김 소리');
  r3.appendChild(segment([['끔',false],['켬',true]], v => prefs.sound === v, v => { prefs.sound = v; save(); if(v){ audio(); pageSound(); } }));

  const r4 = makeRow(m, '자동 넘김<span class="hint">한 쪽을 다 읽으면 이어서 읽습니다</span>');
  r4.appendChild(segment([['끔',false],['켬',true]], v => prefs.auto === v, v => { prefs.auto = v; save(); }));

  document.querySelector('.corner.tr').appendChild(m);
});

/* ── 다시 그리기 ── */
function relayout(){
  const p = pages[cur];
  const anchor = (p && p.type === 'text') ? {chapter:p.chapter, first:p.blocks[0]} : null;
  const wasToc = p && p.type === 'toc';
  paginate();
  let target = 0;
  if(wasToc) target = 1;
  else if(anchor){
    target = chapterStart(anchor.chapter);
    for(let i = target; i < pages.length; i++){
      const b = pages[i].blocks && pages[i].blocks[0];
      if(b && b.t === anchor.first.t && JSON.stringify(b.v) === JSON.stringify(anchor.first.v)){ target = i; break; }
    }
  }
  show(target, 0);
}
let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if(anim) anim.finish(); if(!speaking) relayout(); }, 200);
});

/* ── 본문 보호 ── */
(function(){
  const block = e => { e.preventDefault(); return false; };
  document.addEventListener('contextmenu', block);
  document.addEventListener('copy', block);
  document.addEventListener('cut', block);
  document.addEventListener('dragstart', block);
  document.addEventListener('selectstart', e => {
    const t = e.target;
    if(t && t.closest && t.closest('.panel')) return;
    e.preventDefault();
  });
  document.addEventListener('keydown', e => {
    const k = (e.key || '').toLowerCase();
    if((e.ctrlKey || e.metaKey) && ['c','x','a','s','p','u'].indexOf(k) !== -1){ e.preventDefault(); return false; }
    if(k === 'f12'){ e.preventDefault(); return false; }
    if((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c'].indexOf(k) !== -1){ e.preventDefault(); return false; }
  }, true);
})();


/* ── 원격 차단 스위치 ──
   책이 열릴 때 사무실 서버에 이 책을 열어도 되는지 묻는다.
   서버에서 끄면 그 순간부터 본문이 보이지 않는다.
   서버에 닿지 못하면 마지막 확인 결과를 7일까지 인정한다. */
const BOOK_ID = 'chwieop';
const GUARD_URL = 'https://script.google.com/macros/s/AKfycbz7hOZsr33TjTCGrbc4vbGhxQigeia1xdXMYCkavEs4KUPUO2pcpn9TmZwM0xJvPTLj/exec';
const GUARD_GRACE_DAYS = 7;
const GKEY = 'bookguard:' + BOOK_ID;

async function guardCheck(){
  let state = null;
  try{
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 7000);
    const r = await fetch(GUARD_URL + '?b=' + encodeURIComponent(BOOK_ID) + '&t=' + Date.now(),
                          { cache: 'no-store', signal: ctl.signal });
    clearTimeout(t);
    if(r.ok) state = await r.json();
  }catch(e){}
  if(state){
    const books = state.books || {};
    const open = (state.all !== false) && (books[BOOK_ID] !== false);
    const msg = state.msg || '';
    try{ localStorage.setItem(GKEY, JSON.stringify({ at: Date.now(), open: open, msg: msg })); }catch(e){}
    return { open: open, msg: msg };
  }
  let last = null;
  try{ last = JSON.parse(localStorage.getItem(GKEY) || 'null'); }catch(e){}
  if(last && last.open === false) return { open: false, msg: last.msg || '' };
  if(last && (Date.now() - last.at) > GUARD_GRACE_DAYS * 86400000)
    return { open: false, msg: '인터넷에 연결한 뒤 다시 열어 주십시오. 열람 권한을 확인하지 못했습니다.' };
  return { open: true, msg: '' };
}
function showBlocked(msg){
  const el = document.createElement('article');
  el.className = 'leaf';
  const wrap = document.createElement('div'); wrap.className = 'bodywrap';
  const body = document.createElement('div'); body.className = 'body';
  body.style.cssText = 'display:flex;align-items:center;justify-content:center';
  const box = document.createElement('div');
  box.style.cssText = 'text-align:center;max-width:28ch;word-break:keep-all';
  const tag = document.createElement('div');
  tag.style.cssText = 'font-size:.7rem;letter-spacing:.24em;color:var(--accent);margin-bottom:1rem';
  tag.textContent = '열람 중지';
  const p = document.createElement('p');
  p.className = 'bp';
  p.textContent = msg || '이 책은 현재 열람이 중지되었습니다.';
  const t = document.createElement('div');
  t.style.cssText = 'font-size:.7rem;color:var(--ink-faint);line-height:1.7;margin-top:.7rem';
  t.textContent = BOOK.title + ' · ' + (BOOK.author || '');
  box.append(tag, p, t);
  body.appendChild(box); wrap.appendChild(body); el.appendChild(wrap);
  book.innerHTML = '';
  book.appendChild(el);
  document.querySelectorAll('.corner').forEach(c => c.remove());
}
load();
applyPrefs();
setReadUI(false);
async function boot(){
  const g = await guardCheck();
  if(!g.open){ showBlocked(g.msg); return; }
  paginate();
  const saved = loadPos();
  show(saved > 0 && saved < pages.length ? saved : 0, 0);
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(boot).catch(boot);
else boot();
window.addEventListener('beforeunload', () => { if(ttsOK) synth.cancel(); });
</script>
