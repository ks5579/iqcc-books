<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>IQCC 수험생 이용 안내</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070b14; --bg2:#0e1626; --card:#ffffff;
  --ink:#eef3fb; --dim:#9aabc4; --dim2:#67789a;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.05);
  --blue:#4b8dff; --blue2:#2f6fdd; --gold:#d9b25d;
  --shadow:0 30px 70px -30px rgba(0,0,0,.85);
  --pad:clamp(16px,3.6vw,44px);
  --fs:clamp(.93rem,1.55vw,1.08rem);
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  word-break:keep-all; overflow-wrap:break-word;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 85% at 78% 8%, rgba(47,111,221,.20) 0%, transparent 56%),
    radial-gradient(95% 70% at 12% 96%, rgba(217,178,93,.10) 0%, transparent 60%),
    linear-gradient(170deg,#0d1626 0%,#070b14 62%);
}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column}

/* ───── 머리말 ───── */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--pad);
  padding:clamp(12px,1.9vh,20px) var(--pad) clamp(8px,1.2vh,12px);
}
.brand{
  display:flex;align-items:center;gap:.6rem;flex:0 0 auto;
  text-decoration:none;color:inherit;border-radius:9px;padding:.3rem .5rem;margin:-.3rem -.5rem;
  transition:background .2s,transform .2s;
}
.brand:hover{background:rgba(75,141,255,.1)}
.brand:active{transform:scale(.985)}
.brand .out{color:var(--dim2);opacity:0;transition:opacity .2s,color .2s;flex:0 0 auto;margin-left:.1rem}
.brand:hover .out{opacity:1;color:var(--blue)}
.brand:hover .bt b{color:#fff}
.globe{width:26px;height:26px;flex:0 0 auto;opacity:.95}
.bt{line-height:1.2}
.bt b{display:block;font-size:.84rem;letter-spacing:.01em;font-weight:700}
.bt span{display:block;font-size:.58rem;letter-spacing:.07em;color:var(--dim2);text-transform:uppercase;margin-top:1px}
nav{display:flex;gap:.3rem;margin-left:auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;background:transparent;border:1px solid transparent;color:var(--dim2);
  font:inherit;font-size:.76rem;font-weight:600;padding:.42rem .76rem;border-radius:999px;
  cursor:pointer;transition:.22s;letter-spacing:-.01em;display:flex;align-items:center;gap:.4rem;
}
nav button:hover{color:var(--dim)}
nav button .n{
  width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
  font-size:.58rem;font-weight:700;background:rgba(255,255,255,.07);color:var(--dim2);transition:.22s;
}
nav button.on{color:var(--ink);background:rgba(75,141,255,.13);border-color:rgba(75,141,255,.3)}
nav button.on .n{background:var(--blue);color:#06101f}
nav button.done .n{background:rgba(75,141,255,.3);color:#cfe1ff}

/* ───── 무대 ───── */
main{flex:1 1 auto;position:relative;min-height:0}
.scene{
  position:absolute;inset:0;padding:0 var(--pad);display:grid;align-content:center;
  grid-template-columns:minmax(0,.92fr) minmax(0,1.3fr);
  gap:clamp(20px,3.4vw,54px);align-items:center;
  opacity:0;visibility:hidden;transition:opacity .5s ease,transform .5s ease;transform:translateY(10px);
}
.scene.on{opacity:1;visibility:visible;transform:none}
.txt{min-width:0}
.eyebrow{
  display:inline-flex;align-items:center;gap:.5rem;font-size:.68rem;font-weight:700;
  letter-spacing:.1em;color:var(--blue);margin-bottom:.85rem;text-transform:uppercase;
}
.eyebrow::before{content:"";width:18px;height:1px;background:var(--blue);opacity:.7}
h2{
  font-size:clamp(1.35rem,2.75vw,2.1rem);font-weight:800;line-height:1.26;
  letter-spacing:-.033em;margin-bottom:.95rem;
}
h2 em{font-style:normal;color:var(--blue)}
.lines{display:flex;flex-direction:column;gap:.62rem}
.lines li{
  list-style:none;display:flex;gap:.62rem;align-items:flex-start;
  font-size:var(--fs);line-height:1.72;color:var(--dim);letter-spacing:-.012em;
}
.lines li b{color:#dce7f7;font-weight:600}
.dot{
  flex:0 0 auto;width:17px;height:17px;border-radius:50%;margin-top:.36rem;
  background:rgba(75,141,255,.14);color:var(--blue);display:grid;place-items:center;
  font-size:.6rem;font-weight:700;
}
.note{
  margin-top:1.1rem;padding:.7rem .85rem;border-radius:10px;
  background:rgba(217,178,93,.07);border:1px solid rgba(217,178,93,.2);
  font-size:.82rem;line-height:1.66;color:#e4d1a6;display:flex;gap:.5rem;
}
.note svg{flex:0 0 auto;margin-top:.18rem}

/* ───── 화면 캡처 ───── */
.vis{min-width:0;display:flex;justify-content:center}
.frame{
  position:relative;width:100%;max-width:min(780px,100%);
  border-radius:13px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.07);
}
.frame .bar{
  height:26px;background:linear-gradient(#f7f8fa,#eef0f4);border-bottom:1px solid #e2e6ec;
  display:flex;align-items:center;padding:0 10px;gap:5px;
}
.frame .bar i{width:7px;height:7px;border-radius:50%;background:#d6dae1;display:block}
.frame .load{
  position:absolute;left:0;right:0;top:26px;height:2px;z-index:5;overflow:hidden;pointer-events:none;
}
.frame .load b{
  display:block;width:0;height:100%;background:linear-gradient(90deg,#4b8dff,#2f6fdd);
  box-shadow:0 0 9px rgba(75,141,255,.8);
}
.frame.loading .load b{animation:loadbar .62s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes loadbar{0%{width:0;opacity:1}72%{width:88%;opacity:1}100%{width:100%;opacity:0}}
.frame .bar u{
  flex:1;height:13px;margin-left:7px;border-radius:7px;background:#fff;border:1px solid #e4e8ee;
  font-size:8px;color:#9aa4b2;text-decoration:none;display:flex;align-items:center;padding:0 7px;letter-spacing:.02em;
}
.hold{position:relative;overflow:hidden;background:#fff}
.zoomer{position:relative;display:block}
.hold img{display:block;width:100%;height:auto}

/* 화면 속 단추 — 실제로 누를 수 있다 */
.hot{
  position:absolute;border:0;background:transparent;padding:0;margin:0;
  cursor:pointer;border-radius:7px;z-index:3;
  -webkit-tap-highlight-color:transparent;
}
.hot::before{
  content:"";position:absolute;inset:-5px;border-radius:10px;
  box-shadow:0 0 0 0 rgba(47,111,221,.55);
  animation:hotpulse 2.1s cubic-bezier(.3,.1,.2,1) infinite;
}
.hot::after{
  content:"";position:absolute;inset:0;border-radius:7px;
  background:rgba(47,111,221,0);transition:background .18s;
}
.hot.sub::before{animation-duration:3.6s;opacity:.5}
.hot:hover::after{background:rgba(47,111,221,.16)}
.hot:hover::before{animation:none;box-shadow:0 0 0 4px rgba(47,111,221,.32)}
.hot:active::after,.hot.press::after{background:rgba(47,111,221,.3)}
.hot.press{transform:scale(.965);transition:transform .12s}
@keyframes hotpulse{
  0%{box-shadow:0 0 0 0 rgba(47,111,221,.5)}
  60%{box-shadow:0 0 0 11px rgba(47,111,221,0)}
  100%{box-shadow:0 0 0 0 rgba(47,111,221,0)}
}
.hint{
  position:absolute;z-index:4;white-space:nowrap;pointer-events:none;
  background:rgba(10,16,28,.92);color:#dbe6f6;font-size:.66rem;font-weight:600;
  padding:.26rem .56rem;border-radius:6px;letter-spacing:-.01em;
  transform:translate(-50%,-168%);opacity:0;transition:opacity .3s;
  box-shadow:0 6px 16px -8px #000;
}
.scene.on .hint{opacity:1;transition-delay:1.1s}
.hint::after{
  content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:4px solid transparent;border-top-color:rgba(10,16,28,.92);
}

/* 유령 커서 — 저절로 눌리는 모습 */
#ghost{
  position:fixed;z-index:30;width:21px;height:21px;pointer-events:none;
  opacity:0;transform:translate(-3px,-2px);transition:opacity .22s;
}
#ghost.on{opacity:1}
#ghost.move{transition:left .62s cubic-bezier(.32,.72,.3,1),top .62s cubic-bezier(.32,.72,.3,1),opacity .22s}
#ghost .ring{
  position:absolute;left:1px;top:0;width:12px;height:12px;border-radius:50%;
  border:2px solid rgba(47,111,221,.9);opacity:0;transform:scale(.3);
}
#ghost.tap .ring{animation:tapring .5s ease-out}
@keyframes tapring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(3.1)}}

/* 창이 바뀌는 순간 */
.frame.flip,.mock.flip{animation:flip .34s cubic-bezier(.4,0,.6,1)}
@keyframes flip{0%{transform:none}48%{transform:scale(.978);filter:brightness(.9)}100%{transform:none}}
.scene.enter .frame,.scene.enter .mock{animation:enter .5s cubic-bezier(.22,.7,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(13px) scale(.985)}to{opacity:1;transform:none}}

/* ───── 화면 모형 ───── */
.mock{width:100%;background:#fff;overflow:hidden;color:#20293a}
.mock .mh{padding:15px 18px 0}
.steps{display:flex;align-items:center;gap:6px;padding:14px 18px 16px;border-bottom:1px solid #eef0f4}
.steps .s{flex:1;text-align:center;font-size:.6rem;color:#9aa4b2;letter-spacing:-.01em}
.steps .s i{
  display:block;width:26px;height:26px;margin:0 auto 5px;border-radius:50%;
  background:#f0f2f6;color:#aab3c0;display:grid;place-items:center;font-size:.62rem;font-weight:700;font-style:normal;
}
.steps .s.on{color:#2f6fdd;font-weight:700}
.steps .s.on i{background:#2f6fdd;color:#fff}
.steps .s.ok i{background:#dfe9fb;color:#2f6fdd}
.steps .ar{flex:0 0 auto;color:#cfd5de;font-size:.6rem}
.rows{padding:4px 18px 16px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f2f4f7;font-size:.74rem}
.row:last-child{border-bottom:0}
.row .k{flex:0 0 76px;color:#7a8698;font-size:.7rem}
.row .v{flex:1;color:#20293a}
.row .inp{flex:1;height:26px;border:1px solid #dde2ea;border-radius:5px;background:#fff;display:flex;align-items:center;padding:0 9px;color:#4a5568;font-size:.7rem}
.row .inp.ph{color:#b3bcc8}
.mock .foot{padding:13px 18px 17px;display:flex;justify-content:center;gap:9px;background:#fafbfc;border-top:1px solid #eef0f4}
.btnm{background:#2f6fdd;color:#fff;border-radius:999px;padding:.45rem 1.5rem;font-size:.74rem;font-weight:600;letter-spacing:-.01em}
.btnm.g{background:#fff;color:#6b7686;border:1px solid #dde2ea}
.tagm{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:.16rem .5rem;font-size:.64rem;font-weight:700}
.tagm.b{background:#e7f0ff;color:#2f6fdd}
.tagm.r{background:#fdeaea;color:#d14343}
.tagm.n{background:#eaf6ee;color:#2e8b57}
.pic{
  width:84px;height:108px;border-radius:6px;border:1.5px dashed #c6cedb;background:#f8fAfc;
  display:grid;place-items:center;color:#aab3c0;font-size:.62rem;text-align:center;line-height:1.5;flex:0 0 auto;
}
.pulse{animation:pls 1.7s ease-in-out infinite}
.frame.narrow{max-width:min(580px,100%)}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(47,111,221,.42)}55%{box-shadow:0 0 0 7px rgba(47,111,221,0)}}

/* ───── 표지 · 마침 ───── */
.cover{grid-template-columns:1fr;justify-items:center;text-align:center}
.cover .seal{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin-bottom:1.3rem;
  background:linear-gradient(145deg,#1b2740,#0e1726);border:1px solid rgba(217,178,93,.42);
  box-shadow:0 0 34px -8px rgba(217,178,93,.42);
}
.cover h1{
  font-size:clamp(1.6rem,4.3vw,3rem);font-weight:800;letter-spacing:-.04em;line-height:1.2;margin-bottom:.8rem;
}
.cover h1 span{
  background:linear-gradient(100deg,#fff 28%,#9fc2ff 72%);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.cover p{font-size:var(--fs);color:var(--dim);line-height:1.76;max-width:40ch;margin-bottom:1.6rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.chip{
  display:flex;align-items:center;gap:.46rem;padding:.5rem .95rem;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.035);font:inherit;font-size:.78rem;font-weight:600;
  color:#cfdcef;cursor:pointer;transition:.2s;
}
.chip:hover{background:rgba(75,141,255,.17);border-color:rgba(75,141,255,.5);color:#fff;transform:translateY(-1px)}
.chip:active{transform:translateY(0) scale(.97)}
.chip i{
  width:17px;height:17px;border-radius:50%;background:var(--blue);color:#06101f;
  display:grid;place-items:center;font-size:.58rem;font-weight:800;font-style:normal;
}
.cta{margin-top:1.7rem;font-size:.78rem;color:var(--dim2);display:flex;align-items:center;gap:.5rem;justify-content:center}
.cta kbd{
  background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:6px;
  padding:.18rem .5rem;font:inherit;font-size:.72rem;color:#cfdcef;
}
.endgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.7rem;width:min(760px,100%);margin-top:.3rem}
.endcard{
  text-align:left;padding:.95rem 1.05rem;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.035);
}
.endcard b{display:block;font-size:.8rem;margin-bottom:.4rem;color:#dce7f7}
.endcard span{font-size:.76rem;line-height:1.68;color:var(--dim)}
.endcard a{color:var(--blue);text-decoration:none}

/* ───── 자막 ───── */
#cap{
  flex:0 0 auto;min-height:clamp(42px,6.4vh,62px);display:flex;align-items:center;justify-content:center;
  padding:.3rem var(--pad);text-align:center;
}
#cap span{
  display:inline-block;max-width:74ch;font-size:clamp(.82rem,1.42vw,.97rem);line-height:1.62;
  color:#dbe6f6;background:rgba(5,9,17,.62);border:1px solid var(--line2);
  padding:.46rem 1.05rem;border-radius:9px;backdrop-filter:blur(7px);
  opacity:0;transform:translateY(5px);transition:.3s;letter-spacing:-.012em;
}
#cap span.on{opacity:1;transform:none}
#cap.off{visibility:hidden}

/* ───── 조작 막대 ───── */
footer{
  flex:0 0 auto;display:flex;align-items:center;gap:clamp(8px,1.3vw,16px);
  padding:clamp(9px,1.5vh,14px) var(--pad) calc(clamp(11px,1.9vh,18px) + env(safe-area-inset-bottom));
  border-top:1px solid var(--line2);background:rgba(6,10,18,.55);backdrop-filter:blur(13px);
}
.ic{
  width:35px;height:35px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.045);color:#cfdcef;display:grid;place-items:center;cursor:pointer;transition:.2s;
}
.ic:hover{background:rgba(255,255,255,.1);color:#fff}
.ic:disabled{opacity:.3;cursor:default}
.ic.main{width:43px;height:43px;background:var(--blue);border-color:transparent;color:#05101f}
.ic.main:hover{background:#6ba1ff}
.ic.off{color:var(--dim2)}
.ic.off::after{
  content:"";position:absolute;width:21px;height:1.5px;background:currentColor;transform:rotate(-45deg);border-radius:2px;
}
.ic{position:relative}
#track{flex:1 1 auto;min-width:0;display:flex;gap:3px;align-items:center;height:30px;cursor:pointer}
.seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.1);position:relative;overflow:hidden;transition:height .2s}
#track:hover .seg{height:5px}
.seg b{position:absolute;inset:0;width:0;background:var(--blue);border-radius:2px;display:block}
.seg.full b{width:100%}
.gapmark{flex:0 0 7px}
#meta{flex:0 0 auto;font-size:.68rem;color:var(--dim2);letter-spacing:.02em;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
#spd{
  flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.045);color:#cfdcef;
  border-radius:999px;height:35px;padding:0 .75rem;font:inherit;font-size:.72rem;font-weight:600;cursor:pointer;transition:.2s;
}
#spd:hover{background:rgba(255,255,255,.1)}
#toast{
  position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:40;
  background:rgba(8,13,22,.94);border:1px solid var(--line);color:#dbe6f6;font-size:.74rem;
  padding:.5rem .95rem;border-radius:999px;max-width:82vw;text-align:center;box-shadow:0 12px 34px -14px #000;
}
#toast[hidden]{display:none}

/* ───── 좁은 화면 ───── */
@media (max-width:900px){
  .scene{grid-template-columns:1fr;align-content:start;gap:clamp(12px,2.2vh,20px);
    padding:clamp(6px,1.4vh,14px) var(--pad) 10px;overflow-y:auto;scrollbar-width:none}
  .scene::-webkit-scrollbar{display:none}
  .vis{order:-1}
  .frame,.mock{max-width:min(500px,100%)}
  .hold{max-height:40vh}
  .hold img{max-height:40vh;object-fit:contain;object-position:top center}
  .scene.on .zoomer{transform:scale(1.005)}
  .hint{font-size:.6rem}
  .lines li{font-size:.9rem;line-height:1.66}
  h2{font-size:clamp(1.22rem,5.4vw,1.6rem);margin-bottom:.75rem}
  .cover{align-content:center}
  nav button span{display:none}
  nav button{padding:.42rem .5rem}
  .bt span{display:none}
  footer{flex-wrap:wrap;row-gap:4px}
  #track{order:-1;flex:0 0 100%;height:18px}
}
@media (max-width:620px){
  #meta{display:none}
  .frame .load{
  position:absolute;left:0;right:0;top:26px;height:2px;z-index:5;overflow:hidden;pointer-events:none;
}
.frame .load b{
  display:block;width:0;height:100%;background:linear-gradient(90deg,#4b8dff,#2f6fdd);
  box-shadow:0 0 9px rgba(75,141,255,.8);
}
.frame.loading .load b{animation:loadbar .62s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes loadbar{0%{width:0;opacity:1}72%{width:88%;opacity:1}100%{width:100%;opacity:0}}
.frame .bar u{display:none}
  .endgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .hold img,.scene{transition:none!important}
  .pulse{animation:none}
}
</style>
</head>
<body>
<div id="app">

<header>
  <a class="brand" href="https://www.iqcc.co.kr/" target="_blank" rel="noopener" title="국제자격인증센터 홈페이지 열기">
    <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="#4b8dff" stroke-width="1.5">
      <circle cx="12" cy="12" r="9.2"/><ellipse cx="12" cy="12" rx="4.1" ry="9.2"/>
      <path d="M3.1 9.2h17.8M3.1 14.8h17.8"/>
    </svg>
    <div class="bt"><b>국제자격인증센터</b><span>Qualification Certification Center</span></div>
    <svg class="out" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 4.5H19.5V9.5"/><path d="M19.5 4.5L11.5 12.5"/>
      <path d="M18 14.2v4.3a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6h4.3"/>
    </svg>
  </a>
  <nav id="nav"></nav>
</header>

<main><div id="sceneWrap"></div></main>

<div id="cap"><span id="capTx"></span></div>

<footer>
  <button class="ic" id="prev" title="이전 (←)" aria-label="이전">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.4v14H6zm12 0v14l-9-7z"/></svg>
  </button>
  <button class="ic main" id="play" title="재생 (스페이스)" aria-label="재생"></button>
  <button class="ic" id="next" title="다음 (→)" aria-label="다음">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18 5h-2.4v14H18zM6 5v14l9-7z"/></svg>
  </button>

/* ── 「다은」 목소리 ── */
const TTS = {
  url:'https://btckorea-485701403134.asia-northeast3.run.app/api/tts',
  who:'daeun', voice:'ko-KR-Wavenet-A', pitch:0.0
};
/* 서버 열쇠말 — 아래 따옴표 사이에 넣으면 「다은」 목소리로 읽습니다.
   주소 뒤에 ?gate=열쇠말 을 붙여도 되고, 한 번 넣으면 그 기기에 기억됩니다. */
const GATE_FIXED = '';
let GATE = GATE_FIXED;
try{
  const q = new URLSearchParams(location.search).get('gate');
  if(q){ GATE = q; localStorage.setItem('iqcc_gate', q); }
  else if(!GATE){ GATE = localStorage.getItem('iqcc_gate') || ''; }
}catch(e){}
const synth = window.speechSynthesis;
const ttsOK = !!synth && typeof SpeechSynthesisUtterance === 'function';
const cache = new Map();
let devVoices = [], srvDown = false, warned = false;

function pickDev(){
  if(!devVoices.length) return null;
  return devVoices[0];
}
function loadVoices(){
  if(!ttsOK) return;
  const all = synth.getVoices() || [];
  const ko = all.filter(v => /^ko/i.test(v.lang));
  devVoices = (ko.length ? ko : all).slice().sort((a,b) => {
    const s = v => (/^ko/i.test(v.lang)?300:0) + ((v.name||'').toLowerCase().includes('google')?150:0)
                 + (/female|여성|yuna|heami|sora/i.test(v.name||'')?60:0);
    return s(b) - s(a);
  });
}
if(ttsOK){ loadVoices(); synth.addEventListener('voiceschanged', loadVoices); }

function toast(m){
  const el = document.getElementById('toast');
  el.textContent = m; el.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 3600);
}

async function getMp3(text, rate){
  const key = rate + '|' + text;
  if(cache.has(key)) return cache.get(key);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 11000);
  try{
    const hd = {'content-type':'application/json'};
    if(GATE) hd['x-btck-gate'] = GATE;
    const r = await fetch(TTS.url, {
      method:'POST', signal:ctl.signal, headers:hd,
      body: JSON.stringify({ text:text, who:TTS.who, voice:TTS.voice, rate:rate, pitch:TTS.pitch })
    });
    if(!r.ok) throw new Error('http ' + r.status);
    const b = await r.blob();
    if(!b || b.size < 200) throw new Error('empty');
    const u = URL.createObjectURL(b);
    cache.set(key, u);
    return u;
  } finally { clearTimeout(timer); }
}

        <div class="endcard"><b>온라인 문의</b><span>홈페이지 커뮤니티 › Q&amp;A</span></div>
      </div>
      <div class="cta" style="margin-top:1.2rem">사단법인 온라인유통엠디협회 · 국제자격인증센터</div>
    </div>`;
  }
  const list = s.hots || (s.hot ? [s.hot] : []);
  const hotHTML = list.map((h, k) => {
    const main = k === 0;
    return `<button class="hot${main ? '' : ' sub'}" data-go="${h.go || ''}" title="${h.t}" aria-label="${h.t}"
              style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%"></button>`
         + (main ? `<span class="hint" style="left:${h.x + h.w/2}%;top:${h.y}%">${h.t} 누르기</span>` : '');
  }).join('');
  const vis = s.img
    ? `<div class="frame">
         <div class="bar"><i></i><i></i><i></i><u>${s.url || 'www.iqcc.co.kr'}</u></div>
         <div class="load"><b></b></div>
         <div class="hold" style="--z:${s.z||1.07};--ox:${s.ox||'50%'};--oy:${s.oy||'50%'}">
           <div class="zoomer"><img src="${IMG[s.img]}" alt="">${hotHTML}</div>
         </div>
       </div>`
    : `<div class="frame${s.narrow ? ' narrow' : ''}">
         <div class="bar"><i></i><i></i><i></i><u>${s.url || 'www.iqcc.co.kr'}</u></div>
         <div class="load"><b></b></div>
         ${s.kind === 'apply' ? mockApply() : mockSubmit()}
       </div>`;

  const li = (s.lines||[]).map((t,k) => `<li><span class="dot">${k+1}</span><span>${t}</span></li>`).join('');
  const note = s.note ? `<div class="note">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 7.6v6M12 16.9v.1"/><circle cx="12" cy="12" r="9.4"/></svg>
      <span>${s.note}</span></div>` : '';

  return `<div class="scene" data-i="${i}">
    <div class="txt">
      <div class="eyebrow">${s.eye}</div>
      <h2>${s.t}</h2>
      <ul class="lines">${li}</ul>
      ${note}
    </div>
    <div class="vis">${vis}</div>
  </div>`;
}

wrap.innerHTML = SCENES.map(sceneHTML).join('');
const scenes = Array.from(wrap.children);

/* ── 챕터 단추 ── */
CH.forEach((name, c) => {
  const b = document.createElement('button');
  b.innerHTML = (c ? `<span class="n">${c}</span>` : `<span class="n">·</span>`) + `<span>${name}</span>`;
  b.onclick = () => { const i = SCENES.findIndex(s => s.ch === c); if(i >= 0) go(i, true); };
  nav.appendChild(b);
});

/* ── 진행 막대 ── */
SCENES.forEach((s, i) => {
  if(i && s.ch !== SCENES[i-1].ch){
    const g = document.createElement('span'); g.className = 'gapmark'; track.appendChild(g);
  }
  const seg = document.createElement('span');
  seg.className = 'seg'; seg.innerHTML = '<b></b>';
  seg.onclick = e => { e.stopPropagation(); go(i, true); };
  track.appendChild(seg);
});
const segs = Array.from(track.querySelectorAll('.seg'));

function paint(){
  scenes.forEach((el, i) => {
    const on = i === cur;
    if(on && !el.classList.contains('on')){
      el.classList.add('enter');
      setTimeout(() => el.classList.remove('enter'), 520);
    }
    el.classList.toggle('on', on);
  });
  segs.forEach((s, i) => {
    s.classList.toggle('full', i < cur);
    s.querySelector('b').style.width = i < cur ? '100%' : (i === cur ? '100%' : '0');
    s.querySelector('b').style.transition = i === cur ? 'width .4s' : 'none';
  });
  const c = SCENES[cur].ch;
  Array.from(nav.children).forEach((b, k) => {
    b.classList.toggle('on', k === c);
    b.classList.toggle('done', k < c);
  });
  metaEl.textContent = (cur + 1) + ' / ' + SCENES.length;
  playBtn.innerHTML = playing ? ICON_PAUSE : (cur === SCENES.length - 1 && !playing ? ICON_REPLAY : ICON_PLAY);
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === SCENES.length - 1;
}

/* ── 화면 속 단추를 누르는 동작 ── */
const ghost = document.getElementById('ghost');

function pressFx(btn){
  return new Promise(res => {
    btn.classList.add('press');
    const card = btn.closest('.frame') || btn.closest('.mock');
    setTimeout(() => {
      btn.classList.remove('press');
      if(card){
        card.classList.add('flip','loading');
        setTimeout(() => card.classList.remove('flip'), 360);
        setTimeout(() => card.classList.remove('loading'), 700);
      }
      setTimeout(res, 330);
    }, 130);
  });
}
/* 저절로 커서가 다가가 누르는 모습 — 자동 재생일 때만 */
function ghostClick(btn){
  return new Promise(res => {
    const r = btn.getBoundingClientRect();
    if(!r.width){ res(); return; }
    const sx = r.left + r.width * .5 - 46, sy = r.top + r.height * .5 + 54;
    ghost.classList.remove('move','tap');
    ghost.style.left = sx + 'px'; ghost.style.top = sy + 'px';
    ghost.classList.add('on');
    requestAnimationFrame(() => {
      ghost.classList.add('move');
      ghost.style.left = (r.left + r.width * .5) + 'px';
      ghost.style.top  = (r.top  + r.height * .5) + 'px';
    });
    setTimeout(async () => {
      ghost.classList.add('tap');
      await pressFx(btn);
      ghost.classList.remove('on','tap');
      res();
    }, 680);
  });
}
function hotOf(i){
  const el = scenes[i];
  return el ? el.querySelector('.hot:not(.sub)') : null;
}
function idxOf(key){
  if(!key) return -1;
  return SCENES.findIndex(s => s.img === key || s.kind === key);
}

function setCap(t){
  if(!capOn){ capTx.classList.remove('on'); return; }
  capTx.classList.remove('on');
  setTimeout(() => { capTx.textContent = t; capTx.classList.add('on'); }, 110);
}

/* ── 한 문장 말하기 ── */
function wait(ms, tk){
  return new Promise(res => {
    const t = setTimeout(res, ms);
    wait._stop = () => { clearTimeout(t); res('stop'); };
  });
}
function playAudio(url, tk){
  return new Promise(res => {
    if(!audio){ audio = new Audio(); audio.preload = 'auto'; }
    audio.onended = () => res('end');
    audio.onerror = () => res('err');
    audio.src = url;
    const p = audio.play();
    if(p && p.catch) p.catch(() => res('err'));
  });
}
function speakDevice(text, tk){
  return new Promise(res => {
    if(!ttsOK) return res('err');
    try{ synth.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    const v = pickDev();
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'ko-KR';
    u.rate = Math.min(1.6, 0.98 * rate); u.pitch = 1.0;
    u.onend = () => res('end');
    u.onerror = () => res('err');
    synth.speak(u);
  });
}
async function sayLine(text, tk){
  setCap(text);
  if(muted){ await wait(Math.max(1500, text.length * 118 / rate), tk); return; }
  if(!srvDown){
    try{
      const url = await getMp3(text, 0.98 * rate);
      if(tk !== token) return;
      const r = await playAudio(url, tk);
      if(r === 'end' || tk !== token) return;
    }catch(e){
      srvDown = true;
      if(!warned){ warned = true; toast(GATE ? '서버 목소리를 쓸 수 없어 기기 음성으로 읽습니다' : '열쇠말이 없어 기기 음성으로 읽습니다'); }
    }
  }
  if(tk !== token) return;
  if(ttsOK){ await speakDevice(text, tk); }
  else { await wait(Math.max(1500, text.length * 118 / rate), tk); }
}

function stopSound(){
  token++;
  if(audio){ try{ audio.pause(); }catch(e){} }
  if(ttsOK){ try{ synth.cancel(); }catch(e){} }
  if(wait._stop){ wait._stop(); wait._stop = null; }
}

/* ── 장면 재생 ── */
async function run(){
  const tk = ++token;
  playing = true; paint();
  while(playing && tk === token){
    const s = SCENES[cur];
    const lines = s.narr || [];
    for(let k = 0; k < lines.length; k++){
      if(!playing || tk !== token) return;
      await sayLine(lines[k], tk);
      if(!playing || tk !== token) return;
      await wait(260, tk);
    }
    if(!playing || tk !== token) return;
    if(cur >= SCENES.length - 1){ playing = false; setCap(''); paint(); return; }
    const btn = hotOf(cur);
    if(btn){ await ghostClick(btn); if(!playing || tk !== token) return; }
    cur++;
    preload();
    paint();
    await wait(380, tk);
  }
}
function preload(){
  if(muted || srvDown) return;
  const nx = SCENES[cur + 1];
  if(!nx || !nx.narr) return;
  nx.narr.slice(0, 2).forEach(t => { getMp3(t, 0.98 * rate).catch(() => {}); });
}

function go(i, auto){
  const wasPlaying = playing;
  stopSound();
  playing = false;
  cur = Math.max(0, Math.min(SCENES.length - 1, i));
  setCap('');
  paint();
  if(auto || wasPlaying) setTimeout(() => run(), 160);
}

playBtn.onclick = () => {
  if(playing){ stopSound(); playing = false; if(ttsOK) try{ synth.cancel(); }catch(e){} paint(); return; }
  if(cur === SCENES.length - 1){ go(0, true); return; }
  run();
};
document.getElementById('prev').onclick = () => go(cur - 1, false);
document.getElementById('next').onclick = () => go(cur + 1, false);

document.getElementById('volBtn').onclick = function(){
  muted = !muted;
  this.classList.toggle('off', muted);
  if(muted){ if(audio) try{ audio.pause(); }catch(e){} if(ttsOK) try{ synth.cancel(); }catch(e){} }
  toast(muted ? '소리를 껐습니다' : '소리를 켰습니다');
  if(playing){ const k = cur; stopSound(); playing = false; cur = k; run(); }
};
document.getElementById('capBtn').onclick = function(){
  capOn = !capOn;
  this.classList.toggle('off', !capOn);
  capBox.classList.toggle('off', !capOn);
};
document.getElementById('spd').onclick = function(){
  const i = (RATES.indexOf(rate) + 1) % RATES.length;
  rate = RATES[i];
  this.textContent = rate.toFixed(2).replace(/0$/, '') + '×';
  toast('말하기 빠르기 ' + this.textContent);
  if(playing){ const k = cur; stopSound(); playing = false; cur = k; run(); }
};
track.onclick = e => {
  if(e.target === track){ return; }
};
addEventListener('keydown', e => {
  if(e.key === ' '){ e.preventDefault(); playBtn.click(); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); if(cur < SCENES.length - 1) go(cur + 1, false); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); if(cur > 0) go(cur - 1, false); }
  else if(e.key === 'Escape'){ stopSound(); playing = false; paint(); }
});
/* 손가락으로 넘기기 */
let tx = 0, ty = 0;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 62 && Math.abs(dx) > Math.abs(dy) * 1.6){
    if(dx < 0 && cur < SCENES.length - 1) go(cur + 1, false);
    if(dx > 0 && cur > 0) go(cur - 1, false);
  }
}, {passive:true});

/* 사람이 화면 속 단추를 직접 눌렀을 때 */
wrap.addEventListener('click', async e => {
  const btn = e.target.closest('[data-go]');
  if(!btn) return;
  e.preventDefault();
  const sc = btn.closest('.scene');
  if(!sc || Number(sc.dataset.i) !== cur) return;
  const wasPlaying = playing;
  stopSound(); playing = false;
  ghost.classList.remove('on','tap');
  await pressFx(btn);
  const key = btn.dataset.go || '';
  const to = key ? idxOf(key) : cur + 1;
  if(to >= 0 && to < SCENES.length) go(to, wasPlaying);
  else paint();
});

paint();
</script>
</body>
</html>
